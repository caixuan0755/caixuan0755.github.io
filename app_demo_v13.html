function sharing(){return [1,2,3].map(i=>`<div class="sharing-card"><div>用户：张三<br>手机：131 4588 8888<br>关系：车主</div>${img('group')}<button aria-label="移除成员 ${i}" data-action="移除成员 ${i}">${icon('close')}</button></div>`).join('')+'<button class="row sharing-add" data-action="添加成员">添加成员</button>'}
function profile(){return `<div class="profile-head">${img('avatar')}<div><h2>是凤啊</h2><small>等级 LV1</small></div></div>`+banner()+row('积分 10')+[['个人信息',''],['我的设备','car'],['我的会员','membership'],['产品详情','membership'],['订单管理','orders'],['设备更新',''],['版本信息',''],['系统权限',''],['问题反馈',''],['电子质保',''],['设置','']].map(([n,to])=>row(n,to)).join('')}
function orders(id){const pending=id==='pending-payment',receipt=id==='pending-receipt';return `<div class="order-card"><div class="order-head"><span>下单时间 2023-07-08 12:41</span><span style="color:#ff344c">${pending?'待付款':receipt?'待收货':'已完成'}</span></div><div class="order-product">${img('key')}<div><h3>保时捷液晶钥匙</h3><small>个性款</small><p>¥268 × 1</p></div></div><p>用户地址：萧山区垄龙广场3幢1109</p><p>收货时间：07月08日12:41—07月21日15:00</p><div class="order-total">共 1 件　共计 ¥268</div><div class="order-buttons">${(pending?['修改地址','继续付款']:receipt?['申请售后','查看物流','确认收货']:['取消订单','评价']).map(n=>`<button data-action="${n}">${n}</button>`).join('')}</div></div>`}
function store(){return ['key','car','scooter'].map((n,i)=>`<div class="store-card">${img(n)}<h3>${['液晶钥匙','智能汽车设备','电动车设备'][i]}</h3><button class="row" data-go="pending-payment">查看订单 ${icon('next')}</button></div>`).join('')}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3000)}
function closeActions(){$('#deviceActions').hidden=true;document.querySelectorAll('.plus').forEach(b=>b.setAttribute('aria-expanded','false'))}
function show(id,push=true){if(!names[id])id='car';if(current&&current!==id&&push)stack.push(current);current=id;closeActions();$('#devices').close();const dev=['car','electric-scooter','lcd-key'].includes(id),order=['orders','pending-payment','pending-receipt'].includes(id);
$('#appTop').innerHTML='<div class="status"><span>9:41</span><svg viewBox="0 0 64 15" aria-label="信号、电量"><path d="M1 10h3v5H1zM6 7h3v8H6zM11 4h3v11h-3zM16 1h3v14h-3zM23 4q9-7 18 0l-2 2q-7-5-14 0zM27 8q5-4 10 0l-5 6zM45 3h15v10H45zM61 6h2v4h-2z"/></svg></div>'+(dev?`<div class="app-heading"><button data-switch>${names[id]}${icon('down')}</button><button class="plus" aria-label="设备操作菜单" aria-haspopup="menu" aria-expanded="false">${icon('plus')}</button></div>`:order||id==='vehicle-sharing'?`<div class="app-heading"><button data-back aria-label="返回">${icon('back')}</button><span>${order?'订单列表':'车辆分享'}</span>${icon('scan')}</div>`:'')+(order?'<div class="order-tabs">'+[['全部','orders'],['待付款','pending-payment'],['待发货',''],['待收货','pending-receipt'],['评价','']].map(([n,to])=>`<button ${to?'data-go="'+to+'"':'data-action="'+n+'"'} aria-current="${id===to?'page':'false'}">${n}</button>`).join('')+'</div>':'');
$('#content').innerHTML=dev?devices(id):id==='wallpaper'?wallpaper():id==='vehicle-sharing'?sharing():id==='profile'?profile():order?orders(id):store();
$('#appBottom').hidden=order||id==='vehicle-sharing';$('#appBottom').innerHTML=[['car','设备','home'],['wallpaper','定制','custom'],['membership','发现','bag'],['profile','我的','user']].map(([to,n,ico],i)=>`<button data-go="${to}" aria-current="${(to===id||(dev&&i===0))?'page':'false'}">${icon(ico)}<span>${n}</span></button>`).join('');
$('#appTop').classList.toggle('bentley-top',id==='car');$('#content').classList.toggle('bentley-content',id==='car');if(id==='car')$('#appTop .app-heading').insertAdjacentHTML('afterbegin','<button class="connection" data-action="设备连接状态" aria-label="设备连接状态"><svg class="icon" viewBox="0 0 24 24"><path d="M9 8H6a4 4 0 000 8h3m6-8h3a4 4 0 010 8h-3M7 12h10"/></svg></button>');$('#screen').scrollTop=0;$('#title').textContent=names[id];$('#count').textContent=String(pages.findIndex(p=>p[0]===id)+1).padStart(2,'0')+' / 10';$('#back').disabled=!stack.length;document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.go===id);b.setAttribute('aria-current',b.dataset.go===id?'page':'false')});history.replaceState(null,'','#'+id)}
pages.forEach(([id,n],i)=>{const b=document.createElement('button');b.dataset.go=id;b.textContent=String(i+1).padStart(2,'0')+' / '+n;$('#nav').append(b)});
function back(){if(stack.length)show(stack.pop(),false);else show('car',false)}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){show(go.dataset.go);return}if(e.target.closest('[data-switch]')){$('#devices').showModal();return}const plus=e.target.closest('.plus');if(plus){const open=$('#deviceActions').hidden;closeActions();$('#deviceActions').hidden=!open;plus.setAttribute('aria-expanded',String(open));return}const action=e.target.closest('[data-action],[data-device-action]');if(action){closeActions();toast((action.dataset.action||action.dataset.deviceAction)+'（演示）');return}if(e.target.closest('[data-back]'))back();if(!e.target.closest('#deviceActions'))closeActions()});
$('#back').onclick=back;$('#close').onclick=()=>$('#devices').close();$('#hint').onclick=e=>{const on=$('.app-viewport').classList.toggle('hints');e.target.textContent=on?'隐藏可点击区域':'显示可点击区域';e.target.setAttribute('aria-pressed',String(on))};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeActions()});window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));show(location.hash.slice(1)||'car',false);
</script></html>
