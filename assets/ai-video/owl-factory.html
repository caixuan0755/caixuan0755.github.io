<script>
(()=>{
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const add=(parent,tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);$(parent).append(e);return e};
const wheels=Array.from({length:26},(_,i)=>add('rollers','g',{}));
wheels.forEach((g,i)=>{g.innerHTML='<circle cy="710" r="30" fill="#fff1df" stroke="#182337" stroke-width="5"/><path d="M-19 710H19M0 691V729" fill="none" stroke="#398cf1" stroke-width="4"/><circle cy="710" r="5" fill="#182337" stroke="none"/>';});
const sparks=Array.from({length:9},()=>add('magic','use',{href:'#star'}));
const clouds=Array.from({length:8},()=>add('poof','circle',{r:30}));
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,t)=>a+(b-a)*t;
const tr=(id,v)=>$(id).setAttribute('transform',v),op=(id,v)=>$(id).setAttribute('opacity',v);
let paused=false,time=0,last=null;
function draw(seconds){
const t=((seconds%18)+18)%18,p=t%6,k=Math.floor(t/6),s=Math.sin(t*Math.PI*2);
const work=smooth((p-1.5)/.35)*(1-smooth((p-4.1)/.35));
// Every visible state is a pure function of time, including the loop boundary.
const change=1-smooth(Math.min(p,6-p)/.38),squash=1-.12*change;
tr('owl',`translate(0 ${3*Math.sin(t*Math.PI*2/3)})`);
tr('head',`translate(800 434) rotate(${2*Math.sin(t*Math.PI*2/6)}) scale(${1+.07*change} ${squash}) translate(-800 -434)`);
['artist','engineer','wizard'].forEach((id,i)=>op(id,i===k?1:0));
$('body').setAttribute('fill',['#398cf1','#398cf1','#3265ef'][k]);
op('cape',k===2?1:.0);
tr('leftWing',`rotate(${-6+work*(13+8*Math.sin(p*9))} 675 465)`);
tr('rightWing',`rotate(${7-work*(21+9*Math.sin(p*9))} 926 465)`);
const blink=1-.94*Math.pow(Math.max(0,Math.cos((t-2.3)*Math.PI*2/3)),34);
tr('eyes',`translate(0 369) scale(1 ${blink}) translate(0 -369)`);
tr('orbit',`rotate(${4*Math.sin(t*Math.PI/9)} 804 421)`);
let x=p<1.6?mix(-180,800,smooth(p/1.6)):p<4.5?800:mix(800,1780,smooth((p-4.5)/1.5));
tr('product',`translate(${x} 0)`);
['mug','lamp','rocket'].forEach((id,i)=>op(id,i===k?1:0));
document.querySelectorAll('[data-piece]').forEach(e=>{
 const j=+e.dataset.piece,a=smooth((p-1.85-j*.62)/.65),spread=1-a;
 e.setAttribute('transform',`translate(${[-50,60,135][j]*spread} ${[-12,-95,-30][j]*spread}) rotate(${[-12,16,28][j]*spread} 0 560)`);
});
op('done',smooth((p-3.95)/.25));
sparks.forEach((e,i)=>{const a=i*Math.PI*2/9+p*1.7,r=70+35*Math.sin(p*4+i);e.setAttribute('transform',`translate(${800+Math.cos(a)*r*1.6} ${553+Math.sin(a)*r*.8}) rotate(${p*100+i*30}) scale(${.18+.2*(.5+.5*Math.sin(p*6+i))})`);e.setAttribute('opacity',work*(.5+.5*Math.sin(p*8+i)**2));});
clouds.forEach((e,i)=>{const a=i*Math.PI/4;e.setAttribute('cx',800+Math.cos(a)*(90+95*(1-change)));e.setAttribute('cy',345+Math.sin(a)*(65+65*(1-change)));e.setAttribute('r',25+30*change);e.setAttribute('opacity',change);});
// 18 seconds moves the tread exactly 18 complete wheel spacings.
wheels.forEach((g,i)=>{const xx=-50+i*68+(t*68)%68;g.setAttribute('transform',`translate(${xx} 0)`);g.children[1].setAttribute('transform',`rotate(${t*120} 0 710)`);});
$('modeText').textContent=['01 / 灵感画师','02 / 结构工程师','03 / 奇想魔法师'][k];
}
window.seek=seconds=>{time=seconds;draw(time)};
window.__owlAnimation={duration:18,seek:window.seek,pause:()=>{paused=true},play:()=>{paused=false}};
$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'播放':'暂停'};
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('stage').requestFullscreen?.()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();$('play').click()}});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce){paused=true;time=3.8;$('play').textContent='播放'}
draw(time);
function frame(now){if(last!==null&&!paused)time+=(now-last)/1000;last=now;draw(time);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
